services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
      POSTGRES_USER: ${POSTGRES_USER:-ecommerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecommerce}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    restart: unless-stopped
    command: sh -c "python manage.py collectstatic --noinput && python manage.py migrate --noinput && gunicorn Ecommerce.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./media:/app/media
      - ./static:/app/static
    depends_on:
      - postgres
      - redis

  celery:
    build: .
    restart: unless-stopped
    command: sh -c "celery -A Ecommerce worker -l INFO"
    env_file:
      - .env
    volumes:
      - ./media:/app/media
      - ./static:/app/static
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  redis_data:

